services:
  clankarr:
    image: local/clankarr:1.3
    container_name: clankarr
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - CLANKARR_TOKEN=${CLANKARR_TOKEN}
      - CLANKARR_PORT=8099
    ports:
      - "${CLANKARR_HOST_PORT:-8099}:8099"
    volumes:
      - ${CLANKARR_CONFIG_DIR:-./configs}:/config:ro
    networks:
      - media

networks:
  media:
    external: true
    name: ${CLANKARR_NETWORK:-media_net}
