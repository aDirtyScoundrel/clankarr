services:
  clankarr:
    image: local/clankarr:2.0
    container_name: clankarr
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - CLANKARR_TOKEN=${CLANKARR_TOKEN}
      - CLANKARR_PORT=8099
      - NZBGET_USER=${NZBGET_USER:-}
      - NZBGET_PASS=${NZBGET_PASS:-}
    ports:
      - "${CLANKARR_HOST_PORT:-8099}:8099"
    volumes:
      - ${CLANKARR_CONFIG_DIR:-./configs}:/config:ro
    networks:
      - media

networks:
  media:
    external: true
    name: ${CLANKARR_NETWORK:-media_net}
